name: Deploy to Dev

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to dev
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build
        run: echo "Building commit ${{ github.sha }} for dev"

      - name: Deploy to dev
        run: echo "Deploying ${{ github.sha }} to dev environment"
