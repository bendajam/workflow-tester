name: Deploy (reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: "Environment to deploy to (qa or prod)"
        required: true
        type: string

permissions:
  contents: read
  deployments: read

jobs:
  preview:
    name: Preview — diff from current ${{ inputs.environment }}
    if: inputs.environment == 'prod'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    outputs:
      changelog: ${{ steps.diff.outputs.changelog }}
    steps:
      - name: Validate ref is a tag
        if: github.ref_type != 'tag'
        run: |
          echo "::error::Only tags can be deployed to production. Select a tag from the branch/tag dropdown and try again."
          exit 1

      - name: Diff from current ${{ inputs.environment }} deployment
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ github.ref_name }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          echo "## ${ENVIRONMENT} deployment preview" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Deploying:** \`${REF}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          DEPLOY_JSON=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=${ENVIRONMENT}&per_page=10" \
            2>/dev/null || echo "[]")

          CURRENT_SHA=""
          while read -r id sha; do
            [ -z "$id" ] && continue
            STATUS=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1" \
              --jq '.[0].state // empty' 2>/dev/null || true)
            if [ "$STATUS" = "success" ]; then
              CURRENT_SHA="$sha"
              break
            fi
          done < <(echo "$DEPLOY_JSON" | jq -r '.[] | "\(.id) \(.sha)"')

          if [ -z "$CURRENT_SHA" ]; then
            echo "No prior successful ${ENVIRONMENT} deployment found — this is the first deployment." >> "$GITHUB_STEP_SUMMARY"
            echo "changelog=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SHORT_SHA="${CURRENT_SHA:0:7}"
          echo "**Currently on ${ENVIRONMENT}:** \`${SHORT_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          COMPARE_JSON=$(gh api "repos/$GITHUB_REPOSITORY/compare/${CURRENT_SHA}...${REF}" 2>/dev/null || echo '{"commits":[]}')

          mapfile -t COMMIT_LINES < <(echo "$COMPARE_JSON" | jq -r '.commits[] | .sha[0:7] + " " + (.commit.message | split("\n")[0])')
          COMMITS=${#COMMIT_LINES[@]}

          if [ "$COMMITS" -eq 0 ]; then
            echo "⚠️ **No new commits — this ref is already deployed on ${ENVIRONMENT}.**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**${COMMITS} commit(s) in this deployment:**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "${COMMIT_LINES[@]}" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

          CHANGELOG=$(echo "$COMPARE_JSON" | jq -r \
            '[.commits[] | "- " + (.commit.message | split("\n")[0]) + " (" + .sha[0:7] + ")"] | join("\n")')
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to ${{ inputs.environment }}
    needs: preview
    if: |
      always() &&
      (needs.preview.result == 'success' || needs.preview.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Check for changes since last release
        if: inputs.environment != 'prod'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          ENVIRONMENT="${{ inputs.environment }}"
          CURRENT_SHA="${{ github.sha }}"
          DEPLOYMENTS=$(gh api "repos/$REPO/deployments?environment=$ENVIRONMENT&per_page=30" --jq '.[] | "\(.id) \(.sha)"')

          LAST_SUCCESS_SHA=""
          while read -r id sha; do
            [ -z "$id" ] && continue
            state=$(gh api "repos/$REPO/deployments/$id/statuses?per_page=1" --jq '.[0].state // empty')
            if [ "$state" = "success" ]; then
              LAST_SUCCESS_SHA="$sha"
              break
            fi
          done <<< "$DEPLOYMENTS"

          echo "Last successfully released sha to $ENVIRONMENT: ${LAST_SUCCESS_SHA:-none}"
          echo "Requested sha: $CURRENT_SHA"

          if [ "$LAST_SUCCESS_SHA" = "$CURRENT_SHA" ]; then
            echo "::error::$CURRENT_SHA is already released to $ENVIRONMENT. Nothing to deploy."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Build
        run: echo "Building ${{ github.ref }} (${{ github.sha }}) for ${{ inputs.environment }}"

      - name: Deploy
        run: echo "Deploying ${{ github.ref }} (${{ github.sha }}) to ${{ inputs.environment }} environment"

  release:
    name: Create GitHub release
    if: inputs.environment == 'prod'
    needs: [preview, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release for ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGELOG: ${{ needs.preview.outputs.changelog }}
        run: |
          set -euo pipefail

          NOTES="${CHANGELOG:-No changes since the last release.}"

          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --notes "$NOTES"
          else
            gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" \
              --title "${{ github.ref_name }}" --notes "$NOTES"
          fi

  update-linear:
    name: Update Linear
    if: inputs.environment == 'prod'
    needs: [preview, release]
    runs-on: ubuntu-latest
    steps:
      - name: Update Linear
        env:
          CHANGELOG: ${{ needs.preview.outputs.changelog }}
        run: |
          echo "Updating Linear with changelog:"
          echo "$CHANGELOG"
