name: Deploy to QA

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to deploy"
        required: false
        default: main

jobs:
  deploy:
    name: Deploy to qa
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Build
        run: echo "Building ${{ inputs.ref }} for qa"

      - name: Deploy to qa
        run: echo "Deploying ${{ inputs.ref }} to qa environment"
