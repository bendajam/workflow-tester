name: Deploy to Prod

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to deploy"
        required: false
        default: main

jobs:
  deploy:
    name: Deploy to prod
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Build
        run: echo "Building ${{ inputs.ref }} for prod"

      - name: Deploy to prod
        run: echo "Deploying ${{ inputs.ref }} to prod environment"
